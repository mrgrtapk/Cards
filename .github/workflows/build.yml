name: Build

# Builds Cards on every push. Pushing a version tag (for example v1.0.0) also publishes
# a GitHub Release with the signed APK attached.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      # The signing key lives only in the repository's secrets.
      - name: Signing key
        env:
          STORE_KEYSTORE_BASE64: ${{ secrets.STORE_KEYSTORE_BASE64 }}
          STORE_KEYSTORE_PASSWORD: ${{ secrets.STORE_KEYSTORE_PASSWORD }}
          STORE_KEY_ALIAS: ${{ secrets.STORE_KEY_ALIAS }}
          STORE_KEY_PASSWORD: ${{ secrets.STORE_KEY_PASSWORD }}
        run: |
          # Say which signing secrets this build can see (never their values).
          for name in STORE_KEYSTORE_BASE64 STORE_KEYSTORE_PASSWORD STORE_KEY_ALIAS STORE_KEY_PASSWORD; do
            if [ -n "${!name}" ]; then echo "::notice::$name is set"; else echo "::warning::$name is missing"; fi
          done
          if [ -z "$STORE_KEYSTORE_BASE64" ]; then
            # A version tag must produce a signed release, so stop if the key isn't there.
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::The signing secrets aren't set, so the release can't be signed."
              exit 1
            fi
            exit 0
          fi

          # Ignore spaces or line breaks picked up when the values were pasted in.
          strip() { printf '%s' "$1" | tr -d ' \t\r\n'; }
          KS="$RUNNER_TEMP/release.keystore"
          if ! strip "$STORE_KEYSTORE_BASE64" | base64 -d > "$KS" 2>/dev/null; then
            echo "::error::STORE_KEYSTORE_BASE64 isn't the complete key. Copy the whole long line again."
            exit 1
          fi
          STORE_PW=$(strip "$STORE_KEYSTORE_PASSWORD")
          KEY_PW=$(strip "$STORE_KEY_PASSWORD")
          ALIAS=$(strip "$STORE_KEY_ALIAS")
          echo "::add-mask::$STORE_PW"
          echo "::add-mask::$KEY_PW"

          # Check each value against the key, and say exactly which one is wrong.
          ok=true
          if ! keytool -list -keystore "$KS" -storepass "$STORE_PW" >/dev/null 2>&1; then
            echo "::error::STORE_KEYSTORE_PASSWORD doesn't match the key (or STORE_KEYSTORE_BASE64 is incomplete)."
            ok=false
          else
            echo "::notice::STORE_KEYSTORE_BASE64 and STORE_KEYSTORE_PASSWORD are correct"
            if ! keytool -list -keystore "$KS" -storepass "$STORE_PW" -alias "$ALIAS" >/dev/null 2>&1; then
              echo "::error::STORE_KEY_ALIAS is wrong. It should be: cards"
              ok=false
            else
              echo "::notice::STORE_KEY_ALIAS is correct"
              # keytool doesn't test the key's own password, so a few lines of Java do.
              printf '%s\n' 'public class KeyCheck { public static void main(String[] a) throws Exception {' \
                '  java.security.KeyStore.getInstance(new java.io.File(a[0]), a[1].toCharArray())' \
                '    .getKey(a[2], a[3].toCharArray()); } }' > "$RUNNER_TEMP/KeyCheck.java"
              if ! java "$RUNNER_TEMP/KeyCheck.java" "$KS" "$STORE_PW" "$ALIAS" "$KEY_PW" >/dev/null 2>&1; then
                echo "::error::STORE_KEY_PASSWORD doesn't match the key."
                ok=false
              else
                echo "::notice::STORE_KEY_PASSWORD is correct"
              fi
            fi
          fi
          $ok || exit 1

          {
            echo "STORE_KEYSTORE_FILE=$KS"
            echo "STORE_KEYSTORE_PASSWORD=$STORE_PW"
            echo "STORE_KEY_ALIAS=$ALIAS"
            echo "STORE_KEY_PASSWORD=$KEY_PW"
          } >> "$GITHUB_ENV"

      - name: Build and test
        run: |
          chmod +x gradlew
          set -o pipefail
          if [ -n "$STORE_KEYSTORE_FILE" ]; then
            ./gradlew assembleRelease test --no-daemon 2>&1 | tee build.log
            cp app/build/outputs/apk/release/app-release.apk Cards.apk
          else
            # No signing key available (e.g. a fork): a debug build for testing.
            ./gradlew assembleDebug test --no-daemon 2>&1 | tee build.log
            cp app/build/outputs/apk/debug/app-debug.apk Cards.apk
          fi

      # If the build fails, show the compiler's errors on the run's summary page.
      - name: Report errors
        if: failure()
        run: |
          grep -E -A4 "^e: |What went wrong" build.log | grep -v "^> Task" | head -40 | while IFS= read -r line; do
            echo "::error::${line//%/%25}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: Cards-apk
          path: Cards.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') && env.STORE_KEYSTORE_FILE != ''
        uses: softprops/action-gh-release@v2
        with:
          files: Cards.apk
          generate_release_notes: true
