name: Build

# Builds Cards on every push. Pushing a version tag (for example v1.0.0) also publishes
# a GitHub Release with the signed APK attached.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      # The signing key lives only in the repository's secrets.
      - name: Signing key
        env:
          STORE_KEYSTORE_BASE64: ${{ secrets.STORE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$STORE_KEYSTORE_BASE64" ]; then
            echo "$STORE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "STORE_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build and test
        env:
          STORE_KEYSTORE_PASSWORD: ${{ secrets.STORE_KEYSTORE_PASSWORD }}
          STORE_KEY_ALIAS: ${{ secrets.STORE_KEY_ALIAS }}
          STORE_KEY_PASSWORD: ${{ secrets.STORE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          if [ -n "$STORE_KEYSTORE_FILE" ]; then
            ./gradlew assembleRelease test --no-daemon 2>&1 | tee build.log
            cp app/build/outputs/apk/release/app-release.apk Cards.apk
          else
            # No signing key available (e.g. a fork): a debug build for testing.
            ./gradlew assembleDebug test --no-daemon 2>&1 | tee build.log
            cp app/build/outputs/apk/debug/app-debug.apk Cards.apk
          fi

      # If the build fails, show the compiler's errors on the run's summary page.
      - name: Report errors
        if: failure()
        run: |
          grep -E -A4 "^e: |What went wrong" build.log | grep -v "^> Task" | head -40 | while IFS= read -r line; do
            echo "::error::${line//%/%25}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: Cards-apk
          path: Cards.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') && env.STORE_KEYSTORE_FILE != ''
        uses: softprops/action-gh-release@v2
        with:
          files: Cards.apk
          generate_release_notes: true
