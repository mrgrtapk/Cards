plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'app.kompakt.flashcards'
    compileSdk 37

    defaultConfig {
        applicationId "app.cardsapp.cards"
        minSdk 29
        targetSdk 37
        versionCode 6
        versionName "1.0.5"
        // No Wi‑Fi sync and no internet permission: Cards works entirely offline.
        buildConfigField 'boolean', 'SYNC_ENABLED', 'false'
        buildConfigField 'boolean', 'PUBLIC_EDITION', 'true'
    }

    // Release builds are signed with a key kept in the repository's secrets (never stored here).
    signingConfigs {
        if (System.getenv('STORE_KEYSTORE_FILE')) {
            release {
                storeFile file(System.getenv('STORE_KEYSTORE_FILE'))
                storePassword System.getenv('STORE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('STORE_KEY_ALIAS')
                keyPassword System.getenv('STORE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('STORE_KEYSTORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    // Mudita Mindful Design: e-ink components, theme, and Lato typography.
    implementation 'com.mudita:MMD:1.0.2'

    implementation platform("androidx.compose:compose-bom:${rootProject.ext.compose_bom_version}")
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    testImplementation 'junit:junit:4.13.2'
}
